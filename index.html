<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Saída de Equipamentos</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23dc2626'><path d='M20 18c1.1 0 1.99-.9 1.99-2L22 5c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 5h16v11H4V5z'/></svg>">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.min.js"></script>
  
  <!-- jsPDF e AutoTable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  
  <style>
    :root {
      --primary: #dc2626;
      --primary-hover: #b91c1c;
      --bg: #fef2f2;
      --card-bg: #ffffff;
      --text: #1f2937;
      --border: #fca5a5;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
    }

    #loginScreen {
      max-width: 400px;
      margin: 80px auto;
    }

    .login-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      border: 1px solid var(--border);
    }

    .login-card h2 {
      margin-bottom: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    .btn-logout {
      background-color: #4b5563;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-logout:hover {
      background-color: #1f2937;
    }

    .header-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
      padding: 16px;
      background: #ffffff;
      border-radius: 8px;
      border: 2px solid var(--primary);
      box-shadow: 0 4px 6px -1px rgba(220, 38, 38, 0.1);
    }

    .app-logo {
      height: 40px;
      width: auto;
    }

    .header-title svg {
      width: 40px;
      height: 40px;
      fill: var(--primary);
      flex-shrink: 0;
    }

    .header-title h1 {
      margin: 0;
      color: var(--primary);
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    h2 {
      text-align: center;
      color: var(--primary);
      margin-top: 0;
      border-bottom: 2px solid var(--bg);
      padding-bottom: 8px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 12px;
    }

    .form-group label {
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #7f1d1d;
    }

    .form-group input, .form-group select {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.2);
    }

    .btn-submit {
      width: 100%;
      grid-column: 1 / -1;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .btn-cancel {
      grid-column: 1 / -1;
      background-color: #6b7280;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }

    .btn-cancel:hover {
      background-color: #4b5563;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
    }

    .stat-card {
      background: #fff5f5;
      border-radius: 6px;
      padding: 12px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .stat-card h4 {
      margin: 0;
      text-transform: uppercase;
      font-size: 0.85rem;
      color: #991b1b;
    }

    .stat-card .val {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--primary);
      margin: 6px 0 2px 0;
    }

    .stat-card .pct {
      font-size: 0.8rem;
      color: #7f1d1d;
      font-weight: 500;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 10px;
      text-align: left;
      font-size: 0.9rem;
    }

    th {
      background-color: var(--primary);
      color: white;
    }

    tbody tr:nth-child(even) {
      background-color: #fff5f5;
    }

    .table-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn-export-pdf {
      background-color: #dc2626;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-export-pdf:hover {
      background-color: #b91c1c;
    }

    .btn-action {
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.8rem;
      margin-right: 4px;
    }

    .btn-edit {
      background-color: #eab308;
      color: #fff;
    }

    .btn-edit:hover {
      background-color: #ca8a04;
    }

    .btn-delete {
      background-color: #ef4444;
      color: #fff;
    }

    .btn-delete:hover {
      background-color: #dc2626;
    }

    .error-box {
      background-color: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #f87171;
      margin-bottom: 12px;
      display: none;
    }

    @media print {
      .no-print {
        display: none !important;
      }
      body {
        background: white;
        padding: 0;
      }
      .card {
        box-shadow: none;
        border: none;
        padding: 0;
      }
      th {
        background-color: #333 !important;
      }
    }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="loginScreen">
    <div class="login-card">
      <h2>Acesso ao Sistema</h2>
      <div id="loginErrorAlert" class="error-box"></div>
      <form id="formLogin">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">Senha</label>
          <input type="password" id="loginPassword" placeholder="******" required>
        </div>
        <button type="submit" class="btn-submit">Entrar</button>
      </form>
    </div>
  </div>

  <!-- CONTEÚDO PRINCIPAL -->
  <div class="container" id="appContent" style="display: none;">
    
    <div class="top-bar no-print">
      <button class="btn-logout" onclick="fazerLogout()">🔒 Sair do Sistema</button>
    </div>

    <div class="header-title">
      <img src="img/headset.webp" alt="Logo da Empresa" class="app-logo">
      <h1>CONTROLE DE SAÍDA DE EQUIPAMENTOS</h1>
    </div>

    <div id="errorAlert" class="error-box"></div>

    <!-- Formulário -->
    <div class="card no-print">
      <h2 id="formTitle">Novo Registro</h2>
      <form id="formSaida">
        <input type="hidden" id="registroId">
        
        <div class="form-grid">
          <div class="form-group">
            <label for="equipamento">Equipamento</label>
            <select id="equipamento" required>
              <option value="Headset" selected>Headset</option>
            </select>
          </div>

          <div class="form-group">
            <label for="setor">Setor de Destino</label>
            <select id="setor" required>
              <option value="">Selecione...</option>
              <option value="MOURA">MOURA</option>
              <option value="LIGMINAS">LIGMINAS</option>
              <option value="ME">ME</option>
              <option value="SEST/SENAT">SEST/SENAT</option>
              <option value="SEST/SEFAZ">SEFAZ</option>
              <option value="EMLUB/DEFESA CIVIL">EMLUB/DEFESA CIVIL</option>
              <option value="C.DO VALE">C. DO VALE</option>
              <option value="IPSEMG">IPSEMG</option>
              <option value="RH">RH</option>
            
            </select>
          </div>

          <div class="form-group">
            <label for="lacre">Nº do Lacre / Patrimônio</label>
            <input type="text" id="lacre" placeholder="Ex: L12345" required>
          </div>

          <div class="form-group">
            <label for="responsavel">Nome do Responsável (Opcional)</label>
            <input type="text" id="responsavel" placeholder="Nome de quem recebeu (opcional)">
          </div>

          <div class="form-group">
            <label for="chamado">Nº do Chamado</label>
            <input type="text" id="chamado" placeholder="Ex: CH98765" required>
          </div>

          <div class="form-group">
            <label for="dataRegistro">Data do Registro</label>
            <input type="date" id="dataRegistro" required>
          </div>

          <div class="form-group">
            <label for="horaRegistro">Horário do Registro</label>
            <input type="text" id="horaRegistro" readonly placeholder="Gerado automaticamente" style="background-color: #f3f4f6;">
          </div>

          <button type="submit" id="btnSubmit" class="btn-submit">Registrar Saída</button>
          <button type="button" id="btnCancel" class="btn-cancel" onclick="cancelarEdicao()">Cancelar Edição</button>
        </div>
      </form>
    </div>

    <!-- Indicadores -->
    <div class="card">
      <h2>Estatísticas por Setor</h2>
      <div class="stats-grid" id="statsContainer"></div>
    </div>

    <!-- Tabela -->
    <div class="card">
      <div class="table-actions no-print">
        <button class="btn-export-pdf" onclick="exportarMesAtualPDF()">📄 Exportar Mês (PDF)</button>
      </div>
      <h2>Histórico de Registros</h2>
      <table>
        <thead>
          <tr>
            <th>Equipamento</th>
            <th>Setor</th>
            <th>Lacre</th>
            <th>Responsável</th>
            <th>Chamado</th>
            <th>Data</th>
            <th>Hora</th>
            <th class="no-print">Ações</th>
          </tr>
        </thead>
        <tbody id="tabelaRegistros"></tbody>
      </table>
    </div>
  </div>

  <script>
  const SUPABASE_URL = "https://numxuxojslnujpsmrdwp.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im51bXh1eG9qc2xudWpwc21yZHdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTk5ODUsImV4cCI6MjEwNDc5NTk4NX0.x9hi6BUpQY1UVPUQElaQGg2sE8H__IRqIy8OD0f2ShQ";
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const setoresValidos = ["MOURA", "LIGMINAS", "ME", "SEST/SENAT", "SEFAZ", "SEST/SENAT", "EMLUB/DEFESA CIVIL", "C. DO VALE / EMLURB / D. CIVIL", "IPSEMG", "DETRAN", "RH" ];
  let registrosCache = [];

  const inputData = document.getElementById("dataRegistro");
  const inputHora = document.getElementById("horaRegistro");

  async function verificarSessao() {
    const { data: { session } } = await _supabase.auth.getSession();
    if (session) {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("appContent").style.display = "block";
      carregarDados();
    } else {
      document.getElementById("loginScreen").style.display = "block";
      document.getElementById("appContent").style.display = "none";
    }
  }

  document.getElementById("formLogin").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;
    const errDiv = document.getElementById("loginErrorAlert");
    errDiv.style.display = "none";

    const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

    if (error) {
      errDiv.style.display = "block";
      errDiv.innerText = "Falha no login: " + error.message;
    } else {
      verificarSessao();
    }
  });

  async function fazerLogout() {
    await _supabase.auth.signOut();
    verificarSessao();
  }

  function atualizarHoraAtual() {
    const agora = new Date();
    inputHora.value = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  inputData.valueAsDate = new Date();
  atualizarHoraAtual();
  inputData.addEventListener('change', atualizarHoraAtual);

  function mostrarErro(mensagem) {
    const errDiv = document.getElementById("errorAlert");
    errDiv.style.display = "block";
    errDiv.innerText = mensagem;
  }

  document.getElementById("formSaida").addEventListener("submit", async (e) => {
    e.preventDefault();
    document.getElementById("errorAlert").style.display = "none";

    const registroId = document.getElementById("registroId").value;
    const respValue = document.getElementById("responsavel").value.trim();

    const dados = {
      equipamento: document.getElementById("equipamento").value,
      setor: document.getElementById("setor").value,
      lacre: document.getElementById("lacre").value,
      responsavel: respValue !== "" ? respValue : "-",
      chamado: document.getElementById("chamado").value,
      data_registro: document.getElementById("dataRegistro").value,
      hora_registro: document.getElementById("horaRegistro").value
    };

    if (registroId) {
      const { data, error } = await _supabase
        .from('saidas_equipamentos')
        .update(dados)
        .eq('id', registroId);

      if (error) {
        mostrarErro("Erro ao editar: " + error.message);
      } else {
        alert("Registro atualizado com sucesso!");
        cancelarEdicao();
        carregarDados();
      }
    } else {
      const { data, error } = await _supabase
        .from('saidas_equipamentos')
        .insert([dados]);

      if (error) {
        mostrarErro("Erro de gravação: " + error.message);
      } else {
        alert("Saída de equipamento registrada com sucesso!");
        document.getElementById("formSaida").reset();
        inputData.valueAsDate = new Date();
        atualizarHoraAtual();
        carregarDados();
      }
    }
  });

  async function carregarDados() {
    const { data, error } = await _supabase
      .from('saidas_equipamentos')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      mostrarErro("Erro ao carregar registros: " + error.message);
      return;
    }

    registrosCache = data || [];
    renderizarTabela(registrosCache);
    renderizarEstatisticas(registrosCache);
  }

  function renderizarTabela(registros) {
    const tbody = document.getElementById("tabelaRegistros");
    tbody.innerHTML = "";

    if (!registros || registros.length === 0) {
      tbody.innerHTML = "<tr><td colspan='8' style='text-align:center;'>Nenhum registro encontrado.</td></tr>";
      return;
    }

    registros.forEach(item => {
      const tr = document.createElement("tr");
      const itemId = item.id;
      const eq = item.equipamento || 'Headset';
      const set = item.setor || '-';
      const lac = item.lacre || '-';
      const resp = item.responsavel || '-';
      const cham = item.chamado || '-';
      const dt = item.data_registro || '-';
      const hr = item.hora_registro || '-';

      tr.innerHTML = `
        <td><strong>${eq}</strong></td>
        <td>${set}</td>
        <td>${lac}</td>
        <td>${resp}</td>
        <td>${cham}</td>
        <td>${dt}</td>
        <td>${hr}</td>
        <td class="no-print">
          <button class="btn-action btn-edit" onclick="prepararEdicao('${itemId}')">Editar</button>
          <button class="btn-action btn-delete" onclick="excluirRegistro('${itemId}')">Excluir</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function prepararEdicao(id) {
    const item = registrosCache.find(r => String(r.id) === String(id));
    if (!item) return;

    document.getElementById("registroId").value = item.id;
    document.getElementById("equipamento").value = item.equipamento;
    document.getElementById("setor").value = item.setor;
    document.getElementById("lacre").value = item.lacre;
    document.getElementById("responsavel").value = item.responsavel === '-' ? '' : item.responsavel;
    document.getElementById("chamado").value = item.chamado;
    document.getElementById("dataRegistro").value = item.data_registro;
    document.getElementById("horaRegistro").value = item.hora_registro;

    document.getElementById("formTitle").innerText = "Editar Registro";
    document.getElementById("btnSubmit").innerText = "Salvar Alterações";
    document.getElementById("btnCancel").style.display = "block";
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function cancelarEdicao() {
    document.getElementById("registroId").value = "";
    document.getElementById("formSaida").reset();
    document.getElementById("formTitle").innerText = "Novo Registro";
    document.getElementById("btnSubmit").innerText = "Registrar Saída";
    document.getElementById("btnCancel").style.display = "none";
    inputData.valueAsDate = new Date();
    atualizarHoraAtual();
  }

  async function excluirRegistro(id) {
    if (!confirm("Tem certeza que deseja excluir este registro?")) return;

    const { error } = await _supabase
      .from('saidas_equipamentos')
      .delete()
      .eq('id', id);

    if (error) {
      mostrarErro("Erro ao excluir registro: " + error.message);
    } else {
      carregarDados();
    }
  }

  function renderizarEstatisticas(registros) {
    const container = document.getElementById("statsContainer");
    container.innerHTML = "";

    const total = registros.length;
    const contagem = {};

    setoresValidos.forEach(s => contagem[s] = 0);

    registros.forEach(r => {
      const setorRegistro = (r.setor || '').trim().toUpperCase();
      const chaveEncontrada = setoresValidos.find(s => s === setorRegistro);
      if (chaveEncontrada) {
        contagem[chaveEncontrada]++;
      } else {
        if (!contagem[setorRegistro]) contagem[setorRegistro] = 0;
        contagem[setorRegistro]++;
      }
    });

    const listaSetores = Array.from(new Set([...setoresValidos, ...Object.keys(contagem)]));

    listaSetores.forEach(setor => {
      const qtd = contagem[setor] || 0;
      const pct = total > 0 ? ((qtd / total) * 100).toFixed(1) : "0.0";

      const card = document.createElement("div");
      card.className = "stat-card";
      card.innerHTML = `
        <h4>${setor}</h4>
        <div class="val">${qtd}</div>
        <div class="pct">${pct}% do total</div>
      `;
      container.appendChild(card);
    });
  }

  // EXPORTAR REGISTROS DO MÊS ATUAL EM PDF (COM RESUMO ESTATÍSTICO)
  function exportarMesAtualPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    const agora = new Date();
    const anoAtual = agora.getFullYear();
    const mesAtual = String(agora.getMonth() + 1).padStart(2, '0');
    const prefixoAnoMes = `${anoAtual}-${mesAtual}`;

    const registrosMes = registrosCache.filter(r => r.data_registro && r.data_registro.startsWith(prefixoAnoMes));

    if (registrosMes.length === 0) {
      alert("Nenhum registro encontrado para o mês atual.");
      return;
    }

    // Título do PDF
    doc.setFontSize(16);
    doc.setTextColor(220, 38, 38);
    doc.text("Controle de Saída de Equipamentos", 14, 18);

    doc.setFontSize(10);
    doc.setTextColor(100);
    doc.text(`Relatório do Mês: ${mesAtual}/${anoAtual}`, 14, 25);

    // Cálculos de Estatísticas do Mês
    const totalMes = registrosMes.length;
    const contagemMes = {};
    setoresValidos.forEach(s => contagemMes[s] = 0);

    registrosMes.forEach(r => {
      const setorReg = (r.setor || '').trim().toUpperCase();
      const chave = setoresValidos.find(s => s === setorReg);
      if (chave) {
        contagemMes[chave]++;
      } else {
        if (!contagemMes[setorReg]) contagemMes[setorReg] = 0;
        contagemMes[setorReg]++;
      }
    });

    const listaSetoresMes = Array.from(new Set([...setoresValidos, ...Object.keys(contagemMes)]));

    const colunasStats = ["Setor", "Quantidade", "Porcentagem"];
    const linhasStats = listaSetoresMes.map(setor => {
      const qtd = contagemMes[setor] || 0;
      const pct = totalMes > 0 ? ((qtd / totalMes) * 100).toFixed(1) : "0.0";
      return [setor, qtd.toString(), `${pct}%`];
    });

    // Adiciona linha de total geral ao resumo
    linhasStats.push(["TOTAL GERAL", totalMes.toString(), "100%"]);

    // Tabela 1: Resumo Estatístico por Setor
    doc.setFontSize(12);
    doc.setTextColor(31, 41, 55);
    doc.text("Resumo de Operações por Setor", 14, 34);

    doc.autoTable({
      startY: 37,
      head: [colunasStats],
      body: linhasStats,
      headStyles: { fillColor: [75, 85, 99] },
      alternateRowStyles: { fillColor: [243, 244, 246] },
      styles: { fontSize: 8, cellPadding: 2 }
    });

    // Tabela 2: Histórico Detalhado dos Registros
    const finalYStats = doc.lastAutoTable.finalY + 10;
    doc.text("Detalhamento dos Registros", 14, finalYStats);

    const colunas = ["Equipamento", "Setor", "Lacre", "Responsável", "Chamado", "Data", "Hora"];
    const linhas = registrosMes.map(r => [
      r.equipamento || '-',
      r.setor || '-',
      r.lacre || '-',
      r.responsavel || '-',
      r.chamado || '-',
      r.data_registro || '-',
      r.hora_registro || '-'
    ]);

    doc.autoTable({
      startY: finalYStats + 3,
      head: [colunas],
      body: linhas,
      headStyles: { fillColor: [220, 38, 38] },
      alternateRowStyles: { fillColor: [255, 245, 245] },
      styles: { fontSize: 8, cellPadding: 2.5 }
    });

    doc.save(`registros_saida_${prefixoAnoMes}.pdf`);
  }

  verificarSessao();
</script>
</body>
</html>
